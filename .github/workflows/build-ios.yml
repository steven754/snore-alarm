name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    # macOS runner 自带 Xcode + CocoaPods，无需本机安装 Xcode
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          pod --version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      # Flutter 3.47 的 `flutter build ios --no-codesign` 仍会校验工程里是否配置了
      # DEVELOPMENT_TEAM / PROVISIONING_PROFILE（flutter_tools mac.dart::_missingDevelopmentTeam），
      # 本工程没有签名团队就会报 "requires a selected Development Team" 而失败。
      # 注入一个占位团队绕过该校验；真正的签名已被 CODE_SIGNING_ALLOWED=NO 关闭，
      # 占位值不会被使用。此修改只在 CI 工作区内生效，不入库。
      - name: Inject placeholder DEVELOPMENT_TEAM
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('ios/Runner.xcodeproj/project.pbxproj')
          s = p.read_text(encoding='utf-8')
          if 'DEVELOPMENT_TEAM' not in s:
              s = s.replace(
                  'CODE_SIGN_STYLE = Automatic;',
                  'CODE_SIGN_STYLE = Automatic;\n\t\t\t\tDEVELOPMENT_TEAM = ABCDE12345;')
              p.write_text(s, encoding='utf-8')
              print('  已注入占位 DEVELOPMENT_TEAM = ABCDE12345')
          else:
              print('  DEVELOPMENT_TEAM 已存在，跳过')
          PY

      - name: Build iOS release (unsigned)
        # 即使 flutter build 因后置校验返回非零，Xcode 编译本身可能已成功，
        # 所以不直接中断，交给下一步按产物实际存在与否判定。
        run: flutter build ios --release --no-codesign || echo "::warning::flutter build 返回非零，继续检查产物"

      - name: Verify app bundle
        run: |
          set -e
          APP=build/ios/iphoneos/Runner.app
          if [ ! -d "$APP" ]; then
            echo "::error::未产出 $APP，构建失败"
            ls -la build/ios 2>/dev/null || true
            exit 1
          fi
          echo "  ✓ $APP 已生成"
          echo "--- 二进制架构 ---"
          file "$APP/Runner"
          echo "--- 权限配置 ---"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"
          echo "--- 插件是否链接进二进制 ---"
          nm -gU "$APP/Runner" 2>/dev/null | grep -c -i "record\|permission" || true

      - name: Package unsigned IPA
        run: |
          set -e
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -qry snore-alarm-unsigned.ipa Payload
          ls -lh snore-alarm-unsigned.ipa
          unzip -l snore-alarm-unsigned.ipa | head -8

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: snore-alarm-ipa
          path: build/ios/iphoneos/snore-alarm-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
